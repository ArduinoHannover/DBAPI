; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps = 
	soundstorm/DBAPI @ ^2.4.0
	arduino-libraries/NTPClient @ ^3.2.1
	adafruit/Adafruit GFX Library@^1.11.10
	adafruit/Adafruit ILI9341 @ ^1.5.12
	tzapu/WifiManager @ ^2.0.0
board_build.filesystem = littlefs
monitor_speed = 115200
#upload_protocol = espota
#upload_flags = --auth=iliketrains

[env:2432s028r]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32 @ https://github.com/ArduinoHannover/arduino-esp32.git#adjust-cipher-suits
board = esp32dev
framework = arduino
build_flags = -D BOARD_2432S028R
lib_ldf_mode = deep
lib_deps = 
	soundstorm/DBAPI @ ^2.4.0
	arduino-libraries/NTPClient @ ^3.2.1
	adafruit/Adafruit GFX Library@^1.11.10
	adafruit/Adafruit ILI9341 @ ^1.5.12
	tzapu/WifiManager @ ^2.0.0
board_build.filesystem = littlefs
monitor_speed = 115200
#upload_protocol = espota
#upload_flags = --auth=iliketrains
board_build.partitions = esp32_4M.csv ;0x140000 by default is apprently not enough in some cases, shrink littlefs.

[env:2432s028r_dualusb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32 @ https://github.com/ArduinoHannover/arduino-esp32.git#adjust-cipher-suits
board = esp32dev
framework = arduino
build_flags = -D BOARD_2432S028R -D USE_ST7798
lib_ldf_mode = deep
lib_deps = 
	soundstorm/DBAPI @ ^2.4.0
	arduino-libraries/NTPClient @ ^3.2.1
	adafruit/Adafruit GFX Library@^1.11.10
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	tzapu/WifiManager @ ^2.0.0
board_build.filesystem = littlefs
monitor_speed = 115200
#upload_protocol = espota
#upload_flags = --auth=iliketrains
board_build.partitions = esp32_4M.csv ;0x140000 by default is apprently not enough in some cases, shrink littlefs.
